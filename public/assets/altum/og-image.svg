      <path d="M-20.0 12.5 Q-10.0 10.0, 0 12.5 T20.0 12.5"

            fill="none" stroke="#2FB8CC" stroke-width="1.25" stroke-linecap="round"/>

      <path d="M-17.5 16.5 Q-7.5 14.0, 2.5 16.5 T17.5 16.5"

            fill="none" stroke="#0E6B7A" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    

    </g>

  </g>



